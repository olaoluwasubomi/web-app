name: Automated SAST (Semgrep)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-scan:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Semgrep
        run: python -m pip install semgrep==1.186.0

      - name: Run Semgrep CI
        run: semgrep scan --config p/owasp-top-ten --error app.py
